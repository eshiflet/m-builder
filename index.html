<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbital Table</title>
  <meta name="description" content="Interactive periodic table with 3D electron orbital views.">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="app-header">
    <h1>Orbital Table</h1>
    <div class="segmented app-mode" id="app-mode">
      <button data-value="atoms" class="on">Atoms</button>
      <button data-value="molecules">Molecules</button>
      <button data-value="nucleus">Nucleus</button>
    </div>
    <p class="tagline" id="tagline">Pick an element to see its electrons in 3D.</p>
  </header>

  <main class="layout">
    <section class="table-pane" aria-label="Periodic table">
      <div id="table" class="ptable">
        <div id="readout" class="readout"></div>
      </div>
      <ul id="legend" class="legend"></ul>
    </section>

    <section class="viewer-pane" aria-label="Orbital viewer" id="atom-panel">
      <div class="stage">
        <div id="canvas" class="canvas"></div>

        <div class="stage-top">
          <div id="stage-title" class="stage-title"></div>
          <button id="fit" class="chip" title="Zoom to fit visible orbitals (F)">Fit</button>
        </div>

        <div class="stage-bottom">
          <div id="color-legend" class="color-legend"></div>
          <div class="stage-status"><span id="busy"></span><span id="scale" class="scale"></span></div>
        </div>
      </div>

      <div class="controls">
        <div class="control">
          <span class="control-label">Style</span>
          <div class="segmented" id="style">
            <button data-value="cloud" class="on" title="Probability density as a point cloud">Cloud</button>
            <button data-value="surface" title="Isosurface enclosing ~85% of the probability">Surface</button>
          </div>
        </div>
        <div class="control">
          <span class="control-label">Color</span>
          <div class="segmented" id="color-mode">
            <button data-value="phase" class="on">Phase</button>
            <button data-value="subshell">Subshell</button>
          </div>
        </div>
        <label class="control">
          <span class="control-label">Density</span>
          <input id="density" type="range" min="0.25" max="2.5" step="0.25" value="1">
        </label>
        <label class="toggle"><input id="electrons" type="checkbox" checked> Electrons</label>
        <label class="toggle"><input id="rotate" type="checkbox" checked> Rotate</label>
        <label class="toggle"><input id="axes" type="checkbox"> Axes</label>
      </div>

      <div id="info" class="info"></div>
    </section>

    <section class="viewer-pane" aria-label="Nucleus viewer" id="nuc-panel" hidden>
      <div class="stage">
        <div id="nuc-canvas" class="canvas"></div>
        <div id="nuc-chart" class="canvas" hidden></div>
        <div id="nuc-caption" class="stage-caption"></div>
        <div class="stage-top">
          <div id="nuc-title" class="stage-title"></div>
          <button id="nuc-fit" class="chip" title="Zoom to fit (F)">Fit</button>
        </div>
        <div class="stage-bottom">
          <div id="nuc-legend" class="color-legend"></div>
          <div class="stage-status"><span id="nuc-clock" class="scale"></span><span id="nuc-scale" class="scale"></span></div>
        </div>
      </div>

      <div class="controls">
        <div class="control">
          <span class="control-label">View</span>
          <div class="segmented" id="nuc-view">
            <button data-value="nucleus" class="on">Nucleus</button>
            <button data-value="proton">Inside a proton</button>
            <button data-value="neutron">Inside a neutron</button>
            <button data-value="shell">Shell model</button>
            <button data-value="chart">Chart of nuclides</button>
          </div>
        </div>
        <div class="control" id="nuc-chart-wrap" hidden>
          <span class="control-label">Color by</span>
          <div class="segmented" id="nuc-chart-color">
            <button data-value="mode" class="on">Decay mode</button>
            <button data-value="binding">Binding energy</button>
          </div>
        </div>
        <div class="control" id="nuc-iso-wrap">
          <span class="control-label">Isotope</span>
          <div class="stepper">
            <button id="nuc-iso-down" aria-label="One fewer neutron">−</button>
            <span id="nuc-iso"></span>
            <button id="nuc-iso-up" aria-label="One more neutron">+</button>
          </div>
        </div>
        <div class="control" id="nuc-shell-wrap" hidden>
          <span class="control-label">Orbitals of</span>
          <div class="segmented" id="nuc-shell-kind">
            <button data-value="n" class="on">Neutrons</button>
            <button data-value="p">Protons</button>
          </div>
        </div>
        <label class="control" id="nuc-delta-wrap" hidden>
          <span class="control-label">Deformation δ</span>
          <input id="nuc-delta" type="range" min="-0.3" max="0.4" step="0.01" value="0">
          <span id="nuc-delta-value" class="iso-value"></span>
          <button id="nuc-delta-reset" class="chip" type="button">Ground state</button>
        </label>
        <div class="control" id="nuc-decay-wrap">
          <span class="control-label">Decay &amp; reactions</span>
          <div id="nuc-decay" class="examples"></div>
        </div>
        <div class="control" id="nuc-mode-wrap">
          <span class="control-label">Oscillation</span>
          <div class="segmented" id="nuc-mode">
            <button data-value="auto" class="on">Auto</button>
            <button data-value="dipole">Dipole</button>
            <button data-value="breathing">Breathing</button>
            <button data-value="quadrupole">Quadrupole</button>
            <button data-value="rotation">Rotation</button>
            <button data-value="none">None</button>
          </div>
        </div>
        <div class="control" id="nuc-flow-wrap" hidden>
          <span class="control-label">Flow</span>
          <div class="segmented" id="nuc-flow">
            <button data-value="rigid">Rigid</button>
            <button data-value="mixed" class="on">Measured mix</button>
            <button data-value="fluid">Superfluid</button>
          </div>
        </div>
        <label class="control" id="nuc-spin-wrap" hidden>
          <span class="control-label">Spin</span>
          <input id="nuc-spin" type="range" min="2" max="30" step="2" value="10">
          <span id="nuc-spin-value" class="iso-value">10ħ</span>
        </label>
        <label class="control" id="nuc-rate-wrap">
          <span class="control-label">Time</span>
          <input id="nuc-rate" type="range" min="0" max="100" step="1" value="25">
          <span id="nuc-rate-value" class="iso-value"></span>
        </label>
        <div class="control">
          <span class="control-label">Style</span>
          <div class="segmented" id="nuc-style">
            <button data-value="glow" class="on">Glow</button>
            <button data-value="solid">Solid</button>
          </div>
        </div>
        <div class="control" id="nuc-extra-wrap">
          <label class="toggle"><input id="nuc-field" type="checkbox"> Mean field</label>
          <label class="toggle"><input id="nuc-ruler" type="checkbox" checked> Light ruler</label>
          <label class="toggle" title="Highlight nucleons whose centers are closer than 1 fm"><input id="nuc-pairs" type="checkbox"> Close pairs</label>
        </div>
        <label class="toggle" id="nuc-motion-wrap"><input id="nuc-motion" type="checkbox" checked> Nucleon motion</label>
        <label class="toggle" id="nuc-quarks-wrap"><input id="nuc-quarks" type="checkbox"> Quarks</label>
        <label class="toggle" id="nuc-mesons-wrap" title="Show pions carrying the strong force between nucleons"><input id="nuc-mesons" type="checkbox"> Mesons</label>
        <label class="toggle"><input id="nuc-rotate" type="checkbox" checked> Rotate view</label>
      </div>

      <div id="nuc-info" class="info"></div>
    </section>

    <section class="viewer-pane" aria-label="Molecule builder" id="mol-panel" hidden>
      <div class="builder">
        <div class="builder-row">
          <span class="control-label">Molecule</span>
          <div id="tray" class="tray"></div>
          <div id="charge" class="charge" title="Overall charge, for ions like NH₄⁺ or CO₃²⁻">
            <span class="control-label">Charge</span>
            <button data-step="-1" aria-label="Decrease charge">−</button>
            <span id="charge-value">0</span>
            <button data-step="1" aria-label="Increase charge">+</button>
          </div>
          <button id="tray-clear" class="chip">Clear</button>
        </div>
        <div class="builder-row">
          <span class="control-label">Try</span>
          <div id="examples" class="examples"></div>
        </div>
        <form id="search" class="builder-row" autocomplete="off">
          <span class="control-label">Search</span>
          <input id="search-input" list="library" placeholder="Name or SMILES, e.g. sucrose, caffeine, CC(=O)O" aria-label="Molecule name or SMILES">
          <datalist id="library"></datalist>
          <button class="chip" type="submit">Build</button>
          <span id="search-msg" class="search-msg"></span>
        </form>
        <div id="variants" hidden></div>
      </div>

      <div class="stage">
        <div id="mol-canvas" class="canvas"></div>
        <div class="stage-top">
          <div id="mol-title" class="stage-title"></div>
          <button id="mol-fit" class="chip" title="Zoom to fit (F)">Fit</button>
        </div>
        <div class="stage-bottom">
          <div id="mol-legend" class="color-legend"></div>
        </div>
        <div id="mol-empty" class="stage-empty"></div>
      </div>

      <div class="controls">
        <div class="control">
          <span class="control-label">View</span>
          <div class="segmented" id="mol-view">
            <button data-value="structure" class="on">Structure</button>
            <button data-value="orbitals" title="Valence-bond picture: hybrid orbitals on each atom">Hybrid orbitals</button>
            <button data-value="mo" title="Molecular orbitals spread over the whole molecule (Extended Hückel)">Molecular orbitals</button>
            <button data-value="vib" title="Normal modes of vibration and infrared absorption">Vibrations</button>
            <button data-value="density">Electron density</button>
          </div>
        </div>
        <label class="toggle"><input id="opt-angles" type="checkbox" checked> Angles</label>
        <label class="toggle"><input id="opt-lengths" type="checkbox"> Lengths</label>
        <label class="toggle" id="opt-lp-wrap"><input id="opt-lonePairs" type="checkbox" checked> Lone pairs</label>
        <label class="toggle"><input id="opt-hbonds" type="checkbox" checked> H-bonds</label>
        <label class="toggle"><input id="mol-rotate" type="checkbox" checked> Rotate</label>
        <label class="control" id="mo-iso-wrap" hidden title="Which value of the wavefunction the surface is drawn at">
          <span class="control-label">Surface</span>
          <input id="mo-iso" type="range" min="0" max="100" step="1" value="62">
          <span id="mo-iso-value" class="iso-value"></span>
        </label>
        <label class="control" id="iso-wrap" hidden>
          <span class="control-label">Density</span>
          <input id="iso" type="range" min="0" max="100" step="1" value="66">
          <span id="iso-value" class="iso-value"></span>
        </label>
      </div>

      <div id="mol-info" class="info"></div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
